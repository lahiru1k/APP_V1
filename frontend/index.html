<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serendip Match</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>Serendip Match</h1>
      <p>Compatibility-first connections for Sri Lanka.</p>
      <button id="get-started">Get started</button>
    </header>

    <main>
      <section class="card">
        <h2>How it works</h2>
        <ol>
          <li>Complete a short profile and interests survey.</li>
          <li>Chat anonymously for a set time window.</li>
          <li>Photos unlock when both people feel comfortable.</li>
        </ol>
      </section>

      <section class="card">
        <h2>Sample match insight</h2>
        <div id="match-preview">Loading...</div>
      </section>
    </main>

    <div id="signup-modal" class="modal" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="signup-title">
        <div class="modal-header">
          <h2 id="signup-title">Create your profile</h2>
          <button class="icon-button" id="close-modal" aria-label="Close">×</button>
        </div>
        <div id="modal-body"></div>
        <div class="modal-footer">
          <div class="progress">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <div class="modal-actions">
            <button id="back-step" class="secondary">Back</button>
            <button id="next-step">Next</button>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
